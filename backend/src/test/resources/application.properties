# Solo para pruebas: secreto JWT de prueba (no es un secreto real).
app.jwt.secret=test-only-secret-test-only-secret-0123456789

# WhatsApp (valores de prueba; no son secretos reales)
app.whatsapp.verify-token=test-verify-token
app.whatsapp.app-secret=test-app-secret
app.whatsapp.access-token=test-access-token
app.whatsapp.phone-number-id=1234567890
app.whatsapp.default-tenant-id=tenant-whatsapp-test
app.whatsapp.graph-api-base-url=http://localhost:9

# Sin tareas programadas: las pruebas las invocan a mano con un reloj controlado
app.scheduling.enabled=false

# IA: las pruebas usan un proveedor falso; nunca se llama a Ollama ni se espera al "escribiendo"
app.ai.base-url=http://localhost:9
app.ai.warm-up=false
app.ai.typing-delay-min=0s
app.ai.typing-delay-max=0s
