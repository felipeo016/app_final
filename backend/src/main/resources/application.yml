spring:
  application:
    name: unicanal-backend
  config:
    # Carga opcional del .env de la raíz del repo (formato KEY=VALUE) para desarrollo local.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  # Boot 4: la conexión vive en spring.mongodb.*; spring.data.mongodb.* solo para Spring Data.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/unicanal}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8090}

app:
  # Tareas periódicas (cierre de WebSocket vencidos, alerta de chats en riesgo). Activas siempre;
  # solo las pruebas las desactivan para invocarlas a mano con un reloj controlado.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  # Datos de demostración ("Tienda Demo"): solo con el perfil dev Y SEED_DEMO=true. Idempotente.
  seed-demo: ${SEED_DEMO:false}
  jwt:
    # Sin valor por defecto: el secreto solo viene del entorno (mínimo 32 caracteres).
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  # WhatsApp Cloud API (Meta). Todo vacío por defecto: sin credenciales el canal queda deshabilitado
  # y el webhook rechaza cualquier petición (falla cerrado).
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    default-tenant-id: ${WHATSAPP_DEFAULT_TENANT_ID:}
    graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com/v23.0}
  # Orígenes permitidos para el WebSocket (/ws), separados por coma.
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
    # Cada cuánto se cierran las sesiones cuyo JWT ya venció
    expiry-check-ms: 15000
  # Alerta "cero mensajes perdidos": cada cuánto se buscan chats sin respuesta (los minutos son por empresa)
  risk-alert:
    check-ms: 60000
  # Cada cuánto se cierran los envíos que quedaron en PENDING más de 5 min (pasan a "sin confirmar")
  pending-sweep:
    check-ms: 60000
  # IA local con Ollama (instalado en Windows, fuera de Docker). Si no responde, la app sigue igual sin IA.
  # El modo (Apagada / Sugerencias / Respuesta automática) se elige por empresa en Ajustes.
  ai:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    timeout: ${OLLAMA_TIMEOUT_SECONDS:30}s
    # Cuánto tiempo queda el modelo cargado tras cada uso (formato de Ollama: 30m, 24h...)
    keep-alive: ${OLLAMA_KEEP_ALIVE:24h}
    # Precargar el modelo al arrancar el backend (la primera respuesta no tarda de más)
    warm-up: ${OLLAMA_WARM_UP:true}
    # Espera antes de enviar una respuesta automática, mostrando "La IA está escribiendo…"
    typing-delay-min: 2s
    typing-delay-max: 4s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
