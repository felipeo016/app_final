spring:
  application:
    name: unicanal-backend
  config:
    # Carga opcional del .env de la raíz del repo (formato KEY=VALUE) para desarrollo local.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  # Boot 4: la conexión vive en spring.mongodb.*; spring.data.mongodb.* solo para Spring Data.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/unicanal}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8090}

app:
  jwt:
    # Sin valor por defecto: el secreto solo viene del entorno (mínimo 32 caracteres).
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  # WhatsApp Cloud API (Meta). Todo vacío por defecto: sin credenciales el canal queda deshabilitado
  # y el webhook rechaza cualquier petición (falla cerrado).
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    default-tenant-id: ${WHATSAPP_DEFAULT_TENANT_ID:}
    graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com/v23.0}
  # Orígenes permitidos para el WebSocket (/ws), separados por coma.
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
